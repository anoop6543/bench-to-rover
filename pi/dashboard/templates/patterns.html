<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED patterns</title>
  <style>
    :root {
      --bg: #10141a;
      --card: #1a212b;
      --ink: #e8eef6;
      --muted: #8b9bb0;
      --ok: #3dd68c;
      --bad: #ff6b6b;
      --accent: #6cb6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header, main { max-width: 980px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; }
    .dot { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; margin-right: 0.4rem; }
    .dot.on { background: var(--ok); }
    .dot.off { background: var(--bad); }
    .led {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-block; vertical-align: middle; margin-left: 0.5rem;
      background: #2a1810; box-shadow: inset 0 0 6px #000;
    }
    .led.lit { background: #ffb347; box-shadow: 0 0 14px #ff8a3d; }
    .grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }
    button.pat {
      text-align: left;
      background: var(--card);
      color: var(--ink);
      border: 1px solid #2c3644;
      border-radius: 12px;
      padding: 0.85rem;
      cursor: pointer;
    }
    button.pat:hover { border-color: var(--accent); }
    button.pat.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    button.pat strong { display: block; font-size: 0.95rem; }
    button.pat span { color: var(--muted); font-size: 0.8rem; }
    nav a { color: var(--accent); font-size: 0.85rem; }
    .err { color: var(--bad); font-size: 0.85rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>Onboard LED patterns</h1>
    <p class="sub">
      <span id="link" class="dot off"></span>
      <span id="status">Looking for Arduino…</span>
      <span id="preview" class="led" title="Live LED from the Uno"></span>
    </p>
    <p class="err" id="error"></p>
    <nav><a href="/">Self-test</a> · <a href="/bench">Sensor bench</a></nav>
  </header>
  <main class="grid" id="grid"></main>
  <script>
    const PATTERNS = [
      { id: 0, name: "off", title: "Off", meaning: "Standby / silence" },
      { id: 1, name: "heartbeat", title: "Heartbeat", meaning: "Healthy — lub-dub" },
      { id: 2, name: "ready", title: "Ready", meaning: "Idle, waiting for work" },
      { id: 3, name: "working", title: "Working", meaning: "Busy / in progress" },
      { id: 4, name: "waiting", title: "Waiting", meaning: "Mostly on, hung on input" },
      { id: 5, name: "success", title: "Success", meaning: "Three blinks — OK" },
      { id: 6, name: "warning", title: "Warning", meaning: "Two blinks — check this" },
      { id: 7, name: "fault", title: "Fault", meaning: "Five flashes — error" },
      { id: 8, name: "sos", title: "SOS", meaning: "Morse ··· ——— ···" },
      { id: 9, name: "sleep", title: "Sleep", meaning: "Rare tick — low power" },
      { id: 10, name: "linked", title: "Linked", meaning: "Two pulses — connected" },
      { id: 11, name: "dropped", title: "Dropped", meaning: "Long flash — link down" },
      { id: 12, name: "knock", title: "Knock", meaning: "Short-short-long — message" },
      { id: 13, name: "tally", title: "Tally", meaning: "Counts 1–2–3–4, progress" },
      { id: 14, name: "alarm", title: "Alarm", meaning: "Strobe — needs attention" }
    ];

    const grid = document.getElementById("grid");
    PATTERNS.forEach((p) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pat";
      b.dataset.id = String(p.id);
      b.innerHTML = "<strong>" + p.id + " · " + p.title + "</strong><span>" + p.meaning + "</span>";
      b.addEventListener("click", () => {
        fetch("/api/pattern", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: p.id })
        });
      });
      grid.appendChild(b);
    });

    async function tick() {
      const res = await fetch("/api/state");
      const data = await res.json();
      const a = data.arduino || {};
      document.getElementById("link").className = "dot " + (data.connected ? "on" : "off");
      const name = a.name || "—";
      document.getElementById("status").textContent = data.connected
        ? ("Arduino on " + data.serial_port + " — " + name)
        : ("Disconnected (" + data.serial_port + ")");
      document.getElementById("error").textContent = data.connected ? "" : (data.error || "");
      document.getElementById("preview").className = "led" + (a.led ? " lit" : "");
      document.querySelectorAll("button.pat").forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.id) === Number(a.pattern));
      });
    }
    tick();
    setInterval(tick, 200);
  </script>
</body>
</html>
